<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>BAK LIVE | الملف الشخصي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --ink:#12161f;
  --navy:#161b27;
  --muted:#8a93a3;
  --line:#edf0f4;
  --soft:#f6f8fb;
  --accent:#0f9d6e;
  --gold:#d9b25a;
  --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#f1f3f7}
body{margin:0;font-family:var(--font);color:var(--ink);background:#f1f3f7}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{
  max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
}

/* ---------- top bar ---------- */
.bar{display:flex;justify-content:space-between;align-items:center;height:48px}
.ib{
  width:42px;height:42px;border-radius:14px;background:var(--soft);border:1px solid var(--line);
  display:grid;place-items:center;transition:transform .12s,background .2s;
}
.ib:active{transform:scale(.93);background:#eef1f6}
.ib svg{width:21px;height:21px;fill:none;stroke:var(--navy);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- identity ---------- */
.me{display:flex;align-items:center;gap:16px;margin-top:14px}
.av{position:relative;flex:0 0 auto;width:92px;height:92px}
.av .ring{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 210deg,#f3dfa6,#d9b25a,#0f9d6e,#f3dfa6);padding:3px;
}
.av .ring i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;padding:3px}
.av img,
.av [hidden]{display:none}

.edit{
  position:absolute;bottom:-1px;left:-1px;width:30px;height:30px;border-radius:50%;
  background:var(--navy);border:3px solid #fff;display:grid;place-items:center;
}
.edit svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.info{min-width:0;flex:1}
.name{margin:0;font-size:23px;font-weight:700;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.idchip{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:15px;background:var(--soft);
  border:1px solid var(--line);font-size:13px;color:#5b6475;font-weight:500;direction:ltr;
}
.idchip svg{width:14px;height:14px;fill:none;stroke:#7b8497;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lv{
  display:flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 10px;border-radius:15px;
  background:linear-gradient(135deg,#1c2336,#0f1522);border:1px solid #3a3320;
  box-shadow:0 2px 10px #d9b25a33;color:#f1d99a;font-size:13px;font-weight:700;direction:ltr;letter-spacing:.3px;
}
.lv svg{width:15px;height:15px}

/* ---------- stats ---------- */
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);margin-top:22px;
  border:1px solid var(--line);border-radius:20px;padding:14px 0;
}
.st{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:2px 0;border-radius:12px;min-width:0;background:none;border:0;outline-offset:-2px}
.st:not(:first-child)::before{content:"";position:absolute;right:0;top:14%;bottom:14%;width:1px;background:var(--line);pointer-events:none}
.st b{font-size:22px;font-weight:700;line-height:1.2}
.st span{font-size:12.5px;color:var(--muted)}
.st:active{background:var(--soft)}

/* ---------- wallet ---------- */
.wallet{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.wc{
  display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:14px;border-radius:20px;text-align:right;
  border:1px solid var(--line);background:#fff;box-shadow:0 6px 18px -10px #12161f33;transition:transform .12s;
}
.wc:active{transform:scale(.97)}
.wc .top{display:flex;align-items:center;gap:10px}
.wc .ico{flex:0 0 auto;width:46px;height:46px;border-radius:15px;display:grid;place-items:center}
.wc.d .ico{background:linear-gradient(145deg,#e6f7ff,#cfeeff)}
.wc.c .ico{background:linear-gradient(145deg,#fff3d3,#ffe6a8)}
.wc .ico svg{width:30px;height:30px}
.wc b{display:block;font-size:22px;font-weight:700;line-height:1.2}
.wc span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap}

/* ---------- services ---------- */
.svcs{
  display:grid;grid-template-columns:repeat(4,1fr);gap:18px 4px;margin-top:14px;padding:18px 6px 16px;
  border:1px solid var(--line);border-radius:22px;background:#fff;
}
.sv{display:flex;flex-direction:column;align-items:center;gap:9px;transition:transform .12s}
.sv:active{transform:scale(.94)}
.sv .t{
  width:58px;height:58px;border-radius:19px;display:grid;place-items:center;background:var(--bg-t);
  border:1px solid color-mix(in srgb,var(--c) 14%,transparent);
}
.sv .t svg{width:29px;height:29px;fill:none;stroke:var(--c);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sv .t svg .f{fill:var(--c);fill-opacity:.2;stroke:none}
.sv span{font-size:12.5px;font-weight:500;color:#3a4152;white-space:nowrap}
.sv.r2a{grid-column:3}
.vip .t{background:linear-gradient(145deg,#2a2f42,#14192a);border-color:#3b3524}
.vip .t svg{stroke:#f1d99a}
.vip .t svg .f{fill:#f1d99a;fill-opacity:.28}
.vip span{font-weight:700;color:#8a6a1f}

/* ---------- settings list ---------- */
.sec{margin:26px 4px 10px;font-size:15px;font-weight:700}
.list{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;text-align:right;transition:background .15s}
.row + .row{border-top:1px solid var(--line)}
.row:active{background:var(--soft)}
.row .ri{flex:0 0 auto;width:40px;height:40px;border-radius:13px;background:var(--soft);display:grid;place-items:center}
.row .ri svg{width:21px;height:21px;fill:none;stroke:var(--navy);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.row .ri svg .f{fill:var(--accent);fill-opacity:.2;stroke:none}
.row span{flex:1;font-size:15px;font-weight:500}
.row .ch{width:18px;height:18px;fill:none;stroke:#aab1be;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
  background:var(--navy);color:#fff;padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:500;
  opacity:0;pointer-events:none;transition:.28s;max-width:calc(100% - 40px);text-align:center;z-index:30;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:360px){
  .name{font-size:20px}.av{width:80px;height:80px}
  .st b{font-size:19px}.wc b{font-size:19px}.sv .t{width:52px;height:52px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">

  <header class="bar">
    <button class="ib" data-act="settings" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
    </button>
    <button class="ib" data-act="music" aria-label="الموسيقى">
      <svg viewBox="0 0 24 24"><path d="M9 18V6.500l10-2V16"/><circle cx="6.500" cy="18" r="2.500"/><circle cx="16.500" cy="16" r="2.500"/></svg>
    </button>
  </header>

  <section class="me">
    <div class="av">
      <div class="ring"><i><img id="avImg" alt="" hidden></i></div>
      <button class="edit" id="editBtn" aria-label="تعديل الصورة">
        <svg viewBox="0 0 24 24"><path d="M4 20l4.500-1 10-10a2.100 2.100 0 00-3-3l-10 10z"/><path d="M13.500 7.500l3 3"/></svg>
      </button>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
    <div class="info">
      <h1 class="name" id="name"></h1>
      <div class="chips">
        <button class="idchip" id="copyId" aria-label="نسخ المعرّف">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.500"/><path d="M5 15V6.500A2.500 2.500 0 017.500 4H15"/></svg>
          <span id="uid"></span>
        </button>
        <button class="lv" data-act="level" aria-label="مستوى الثروة">
          <svg viewBox="0 0 24 24"><path d="M3 8l4.500 4L12 4l4.500 8L21 8l-2 11H5z" fill="#f1d99a" stroke="#f1d99a" stroke-width="1" stroke-linejoin="round"/></svg>
          <span id="lvl"></span>
        </button>
      </div>
    </div>
  </section>

  <section class="stats" aria-label="الإحصاءات">
    <button class="st" data-act="visitors"><b id="sVis"></b><span>الزوار</span></button>
    <button class="st" data-act="friends"><b id="sFri"></b><span>الأصدقاء</span></button>
    <button class="st" data-act="followers"><b id="sFol"></b><span>المتابعون</span></button>
    <button class="st" data-act="fans"><b id="sFan"></b><span>المعجبون</span></button>
  </section>

  <section class="wallet">
    <button class="wc d" data-act="diamonds">
      <div class="top"><div class="ico">
        <svg viewBox="0 0 32 32"><defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9ecff"/><stop offset=".5" stop-color="#39b6f5"/><stop offset="1" stop-color="#1b78d6"/></linearGradient></defs>
        <path d="M8 6h16l6 8-14 14L2 14z" fill="url(#dg)"/><path d="M2 14h28M12 6l-3 8 7 14 7-14-3-8" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </div>
      <b id="wDia"></b></div><span>الألماس المكتسب</span>
    </button>
    <button class="wc c" data-act="coins">
      <div class="top"><div class="ico">
        <svg viewBox="0 0 32 32"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset=".55" stop-color="#f2b73a"/><stop offset="1" stop-color="#c98a12"/></linearGradient></defs>
        <circle cx="16" cy="16" r="13" fill="url(#cg)"/><circle cx="16" cy="16" r="9.500" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="1.4"/>
        <path d="M13 11.500h4.200a2.300 2.300 0 010 4.500H13m0 0h4.800a2.400 2.400 0 010 4.800H13zm0-4.500v9.300" fill="none" stroke="#8a5a06" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <b id="wCoin"></b></div><span>عملات الشحن</span>
    </button>
  </section>

  <section class="svcs" aria-label="الخدمات">
    <button class="sv" data-act="family" style="--c:#5b4bdb;--bg-t:#f0eeff">
      <div class="t"><svg viewBox="0 0 24 24"><circle class="f" cx="8" cy="8.500" r="3"/><circle class="f" cx="16.500" cy="9.500" r="2.500"/><circle cx="8" cy="8.500" r="3"/><circle cx="16.500" cy="9.500" r="2.500"/><path d="M2.500 19c0-3.200 2.500-5.200 5.500-5.200s5.500 2 5.500 5.200"/><path d="M14.500 14.300c.6-.2 1.300-.3 2-.3 2.600 0 4.500 1.700 4.500 4.500"/></svg></div>
      <span>العائلة</span>
    </button>
    <button class="sv vip" data-act="vip">
      <div class="t"><svg viewBox="0 0 24 24"><path class="f" d="M3 8l4.500 4L12 5l4.500 7L21 8l-2 11H5z"/><path d="M3 8l4.500 4L12 5l4.500 7L21 8l-2 11H5z"/><path d="M7 21.500h10"/></svg></div>
      <span>VIP</span>
    </button>
    <button class="sv" data-act="store" style="--c:#e0456b;--bg-t:#fff0f3">
      <div class="t"><svg viewBox="0 0 24 24"><path class="f" d="M5 8h14l-1 12H6z"/><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6.500a3 3 0 016 0V8"/><path d="M9.500 13a2.500 2.500 0 005 0"/></svg></div>
      <span>المتجر</span>
    </button>
    <button class="sv" data-act="look" style="--c:#2a7fd4;--bg-t:#eaf5ff">
      <div class="t"><svg viewBox="0 0 24 24"><path class="f" d="M8.500 4L3 7l2 4 2-1v10h10V10l2 1 2-4-5.500-3a3.500 3.500 0 01-7 0z"/><path d="M8.500 4L3 7l2 4 2-1v10h10V10l2 1 2-4-5.500-3a3.500 3.500 0 01-7 0z"/></svg></div>
      <span>مظهري</span>
    </button>
    <button class="sv r2a" data-act="agency" style="--c:#0f9d85;--bg-t:#e6f8f4">
      <div class="t"><svg viewBox="0 0 24 24"><rect class="f" x="3" y="7" width="18" height="13" rx="3"/><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5.500A1.500 1.500 0 0110.500 4h3A1.500 1.500 0 0115 5.500V7M3 13h18"/><path d="M11 13v2.500h2V13"/></svg></div>
      <span>مركز الوكالة</span>
    </button>
    <button class="sv" data-act="host" style="--c:#a04bd8;--bg-t:#f6ecff">
      <div class="t"><svg viewBox="0 0 24 24"><rect class="f" x="9" y="3" width="6" height="11" rx="3"/><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3M9 21h6"/></svg></div>
      <span>مركز المضيف</span>
    </button>
  </section>

  <h2 class="sec">إعدادات وخدمات الحساب</h2>
  <section class="list">
    <button class="row" data-act="post">
      <div class="ri"><svg viewBox="0 0 24 24"><path class="f" d="M21 3L3 10.500l7 3 3 7z"/><path d="M21 3L3 10.500l7 3 3 7z"/><path d="M10 13.500L21 3"/></svg></div>
      <span>أنشر</span>
      <svg class="ch" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="row" data-act="help">
      <div class="ri"><svg viewBox="0 0 24 24"><circle class="f" cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="9"/><path d="M9.500 9.500a2.600 2.600 0 015 .8c0 1.700-2.500 2-2.500 3.500"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg></div>
      <span>المساعدة والدعم</span>
      <svg class="ch" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="row" data-act="privacy">
      <div class="ri"><svg viewBox="0 0 24 24"><path class="f" d="M12 3l7.500 3v5.500c0 4.500-3.100 8-7.500 9.500-4.400-1.500-7.500-5-7.500-9.500V6z"/><path d="M12 3l7.500 3v5.500c0 4.500-3.100 8-7.500 9.500-4.400-1.500-7.500-5-7.500-9.500V6z"/><path d="M8.800 12l2.300 2.300 4.200-4.600"/></svg></div>
      <span>الأمان والخصوصية</span>
      <svg class="ch" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
  </section>

</main>
<div class="toast" id="toast" role="status"></div>

<script>
/* Account values are injected by the native Android app. */
const profile = {
  name:'جارٍ تحميل الملف الشخصي...', id:'', level:1, avatarUrl:null,
  visitors:null, friends:0, followers:0, fans:0, diamonds:0, coins:0
};

const $ = id => document.getElementById(id);
const fmt = n => (n===null||n===undefined) ? '–' : Number(n).toLocaleString('en-US');

function render(){
  $('name').textContent = profile.name;
  $('uid').textContent = 'ID: ' + profile.id;
  $('lvl').textContent = 'LV ' + profile.level;
  $('sVis').textContent = fmt(profile.visitors);
  $('sFri').textContent = fmt(profile.friends);
  $('sFol').textContent = fmt(profile.followers);
  $('sFan').textContent = fmt(profile.fans);
  $('wDia').textContent = fmt(profile.diamonds);
  $('wCoin').textContent = fmt(profile.coins);
  if(profile.avatarUrl){ $('avImg').src=profile.avatarUrl; $('avImg').hidden=false; }
  else { $('avImg').removeAttribute('src'); $('avImg').hidden=true; }
}

function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2000);
}

/* Native Android actions keep all destinations inside BAK LIVE. */
document.addEventListener('click', e=>{
  const button=e.target.closest('[data-act]');
  if(!button) return;
  if(window.BAK && BAK.onAction) BAK.onAction(button.dataset.act);
});
$('copyId').onclick=()=>{
  if(window.BAK && BAK.copyId) BAK.copyId();
  else toast('ID: '+profile.id);
};
$('editBtn').onclick=()=>{
  if(window.BAK && BAK.onAction) BAK.onAction('editAvatar');
};
window.setProfileData=function(data){
  if(!data) return;
  Object.keys(profile).forEach(key=>{
    if(Object.prototype.hasOwnProperty.call(data,key)) profile[key]=data[key];
  });
  render();
};

render();
</script>
</body>
</html>
