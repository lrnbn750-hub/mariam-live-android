<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#161b27">
<title>BAK LIVE | SVIP</title>
<style>
:root{
  --ink:#161b27;
  --deep:#1b2130;
  --panel:#232938;
  --line:#3a4154;
  --text:#e9ecf3;
  --muted:#7f889b;
  --cream:#efdfc0;
  --cream-d:#d6bd8c;
  --ok:#5fd6a4;
  --bad:#ff7a86;
  --tier:#6f7dff;
  --font:Tahoma,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0f131c;overscroll-behavior-y:contain}
body{margin:0;font-family:var(--font);color:var(--text);background:#0f131c;overscroll-behavior-y:contain}
button{font-family:inherit;color:inherit;cursor:pointer}
svg{display:block}
.app{
  max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;
  background:var(--ink);position:relative;display:flex;flex-direction:column;
  box-shadow:none;
}

/* ---------- Header + tabs ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--ink);padding-top:env(safe-area-inset-top)}
.head{display:flex;align-items:center;gap:6px;height:48px;padding:0 12px}
.back{width:34px;height:34px;border:0;background:none;display:grid;place-items:center;border-radius:50%}
.back svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.title{font-size:17px;font-weight:700;letter-spacing:.5px}
.wallet{
  margin-inline-start:auto;display:flex;align-items:center;gap:7px;
  padding:6px 12px 6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--deep);
  font-size:13px;font-weight:600;
}
.wallet svg{width:16px;height:16px;fill:none;stroke:#7fd8ff;stroke-width:1.6;stroke-linejoin:round}
.wallet small{color:var(--muted);font-weight:500;font-size:11px}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:3px 7px 3px;gap:1px;scroll-snap-type:x proximity;overscroll-behavior-x:contain;touch-action:pan-x}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;scroll-snap-align:center;border:0;background:none;padding:6px 10px 9px;font-size:14px;font-weight:600;
  color:#6b7385;position:relative;transition:color .2s;
}
.tab[aria-selected="true"]{color:#fff;font-weight:700}
.tab[aria-selected="true"]::after{
  content:"";position:absolute;bottom:2px;left:50%;width:14px;height:4px;margin-left:-7px;border-radius:3px;background:var(--cream);
}
.tab.owned::before{
  content:"";position:absolute;top:8px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--ok);
}
:focus-visible{outline:2px solid var(--cream);outline-offset:2px}

/* ---------- Hero ---------- */
.hero{
  position:relative;height:170px;overflow:hidden;touch-action:pan-y;
  background:
    linear-gradient(118deg,transparent 0 34%,#ffffff07 34% 52%,transparent 52%),
    linear-gradient(242deg,transparent 0 34%,#ffffff07 34% 52%,transparent 52%),
    linear-gradient(180deg,var(--ink),#181e2b);
}
.hero::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(closest-side at 50% 52%,color-mix(in srgb,var(--tier) 42%,transparent),transparent 78%);
  transition:background .5s;
}
.badge{position:absolute;left:50%;top:0;width:150px;margin-left:-75px;animation:pop .55s cubic-bezier(.2,.8,.2,1)}
.badge svg{width:100%;height:auto;filter:drop-shadow(0 16px 26px #000b)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.88)}to{opacity:1;transform:none}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.sp{animation:tw 2.6s ease-in-out infinite}

/* ---------- Panel ---------- */
.panel{
  position:relative;flex:1;margin-top:-18px;padding:18px 14px 20px;
  background:var(--panel);border-radius:50% 50% 0 0 / 34px 34px 0 0;
}
.ptitle{display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:500;color:#f3e7cf;margin:0 0 15px}
.ptitle::before,.ptitle::after{content:"";width:46px;height:1px;background:linear-gradient(90deg,transparent,var(--cream-d),transparent)}
.ptitle i{width:6px;height:6px;background:var(--cream);transform:rotate(45deg);order:1}
.ptitle::after{order:2}.ptitle::before{order:0}
.ptitle span{order:1}
.ptitle i{display:none}

/* elite box */
.elite{
  position:relative;margin-top:10px;padding:36px 12px 14px;text-align:center;border:1px solid #565e72;border-radius:12px;
  background:
    repeating-linear-gradient(45deg,#ffffff05 0 1px,transparent 1px 14px),
    repeating-linear-gradient(-45deg,#ffffff05 0 1px,transparent 1px 14px),
    #212736;
}
.ribbon{
  position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  padding:5px 34px 13px;background:linear-gradient(#f4e5c6,#d8be8d);color:#3a2d12;
  font-size:14px;font-weight:700;white-space:nowrap;
  clip-path:polygon(0 0,100% 0,93% 68%,50% 100%,7% 68%);
}
.qbtn{
  position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;border:1.6px solid var(--cream);
  background:none;color:var(--cream);font-size:16px;font-weight:700;line-height:1;display:grid;place-items:center;
}
.circ{
  width:54px;height:54px;margin:0 auto;border-radius:50%;border:1px solid #565e72;display:grid;place-items:center;
  position:relative;background:#262c3b;
}
.circ svg{width:30px;height:30px;fill:none;stroke:#8b93a6;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.elite .circ{width:58px;height:58px}
.elite .circ svg{width:32px;height:32px}
.elite p{margin:10px 0 0;font-size:11px;color:#6f778a}
.elite.on p{color:#aeb6c7}
.elite.on .circ{border-color:var(--cream-d)}
.elite.on .circ svg{stroke:var(--cream)}

/* privilege grid */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,3vw,22px) 6px;margin-top:26px;content-visibility:auto;contain:layout paint;contain-intrinsic-size:520px}
.pv{text-align:center;padding:0}
.pv .circ{width:58px;height:58px}
.pv span{display:block;margin-top:7px;font-size:11px;line-height:1.45;color:#59617a}
.pv.on .circ{border-color:color-mix(in srgb,var(--tier) 55%,#fff 10%);background:color-mix(in srgb,var(--tier) 12%,#262c3b)}
.pv.on .circ svg{stroke:#f1ecdd}
.pv.on span{color:#b4bccb}
.pv .lk{
  position:absolute;bottom:-2px;left:-2px;width:20px;height:20px;border-radius:50%;background:var(--panel);
  border:1px solid #565e72;display:grid;place-items:center;
}
.pv .lk svg{width:11px;height:11px;stroke:#7a8296;stroke-width:2}
.pv small{display:block;font-size:10.5px;color:#4d556b;margin-top:3px}

/* breakdown */
.split{margin-top:20px;border:1px solid var(--line);border-radius:12px;background:#202635;overflow:hidden}
.split h3{margin:0;padding:14px 16px;font-size:14.5px;font-weight:600;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;font-size:13px;color:#aab2c3}
.row + .row{border-top:1px solid #2b3244}
.row b{font-weight:600;color:var(--text);font-size:14px;display:flex;align-items:center;gap:5px}
.row b svg{width:14px;height:14px;fill:none;stroke:#7fd8ff;stroke-width:1.7;stroke-linejoin:round}
.row.ret b{color:var(--ok)}
.bar2{height:8px;display:flex;margin:4px 16px 14px;border-radius:5px;overflow:hidden;background:#2b3244}
.bar2 i{display:block;height:100%}
.bar2 .a{background:#8d96aa}.bar2 .b{background:var(--ok)}
.legend{display:flex;justify-content:space-between;padding:0 16px 14px;font-size:11px;color:var(--muted)}
.note{margin:0;padding:0 16px 16px;font-size:11.5px;line-height:1.9;color:var(--muted)}

/* ---------- Bottom bar ---------- */
.buy{
  position:sticky;bottom:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--deep);border-top:1px solid #2c3345;
}
.pr{flex:1;min-width:0}
.pr .l1{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.pr .amt{font-size:17px;font-weight:700;letter-spacing:.2px}
.pr .per{font-size:13px;color:#8a93a6}
.pr .dm{width:16px;height:16px;fill:none;stroke:#7fd8ff;stroke-width:1.7;stroke-linejoin:round;align-self:center}
.pr .l2{margin-top:3px;font-size:12px;color:#6c7488;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .l2.ok{color:var(--ok)}
.btn{height:38px;border-radius:20px;font-size:14px;font-weight:700;padding:0 17px;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.send{background:none;border:1.5px solid var(--cream);color:var(--cream)}
.btn.main{background:var(--cream);border:1.5px solid var(--cream);color:#2d2411;min-width:76px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- Sheet ---------- */
.veil{position:fixed;inset:0;z-index:50;background:#05080dcc;display:none;align-items:flex-end;justify-content:center}
.veil.open{display:flex}
.sheet{
  width:100%;max-width:480px;background:#202635;border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  border:1px solid var(--line);border-bottom:0;animation:up .28s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto;
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:2px;background:#464e63;margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font-size:18px;font-weight:700}
.sheet .sub{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.8}
.sheet .split{margin-top:0}
.field{display:block;margin:0 0 14px}
.field span{display:block;font-size:12.5px;color:#aab2c3;margin-bottom:7px}
.field input{
  width:100%;height:46px;border-radius:12px;border:1px solid #4a5268;background:#181d2a;color:var(--text);
  padding:0 14px;font-size:16px;font-family:inherit;direction:ltr;text-align:right;
}
.field input:focus{outline:none;border-color:var(--cream)}
.err{margin:10px 0 0;font-size:12.5px;color:var(--bad);line-height:1.8}
.acts{display:flex;gap:10px;margin-top:16px}
.acts .btn{flex:1;padding:0}
.btn.ghost{background:none;border:1px solid #4a5268;color:#c4cbda}

.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);z-index:60;max-width:calc(100% - 32px);
  background:#f4ecdb;color:#2a2210;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;
  transition:.3s;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:360px){
  .tab{padding:8px 9px 12px;font-size:15px}
  .btn{padding:0 16px;font-size:15px}
  .pr .amt{font-size:18px}
  .pv span{font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="top">
    <div class="head">
      <button class="back" aria-label="رجوع" id="backBtn"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <div class="title">SVIP</div>
      <div class="wallet" aria-label="رصيد الألماس">
        <svg viewBox="0 0 24 24"><path d="M6 4h12l4 6-10 11L2 10z"/><path d="M2 10h20M9 4l-2 6 5 11 5-11-2-6"/></svg>
        <span id="balance">30,000</span>
      </div>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="مستويات SVIP"></div>
  </div>

  <section class="hero" id="hero" aria-live="polite">
    <div class="badge" id="badge"></div>
  </section>

  <main class="panel">
    <h2 class="ptitle"><span>الامتيازات</span></h2>

    <div class="elite" id="elite">
      <div class="ribbon">امتيازات النخبة</div>
      <button class="qbtn" id="infoBtn" aria-label="ما هي امتيازات النخبة؟">?</button>
      <div class="circ" id="eliteIcon"></div>
      <p>دخول رجل غامض الغرفة للتو.</p>
    </div>

    <div class="grid" id="grid"></div>

    <section class="split" aria-labelledby="splitTitle">
      <h3 id="splitTitle">تفاصيل العضوية</h3>
      <div class="row"><span>سعر الباقة</span><b id="sPrice"></b></div>
      <div class="row"><span>مدة العضوية</span><b>30 يوماً</b></div>
      <p class="note">يتم التحقق من السعر والرصيد وتنفيذ الاشتراك من خادم BAK LIVE. مدة العضوية 30 يوماً.</p>
    </section>
  </main>

  <div class="buy">
    <div class="pr">
      <div class="l1">
        <span class="amt" id="bPrice"></span>
        <svg class="dm" viewBox="0 0 24 24"><path d="M6 4h12l4 6-10 11L2 10z"/><path d="M2 10h20M9 4l-2 6 5 11 5-11-2-6"/></svg>
        <span class="per">/ 30 يوم</span>
      </div>
      <div class="l2" id="bState"></div>
      <div class="l2" id="bUsd"></div>
    </div>
    <button class="btn main" id="buyBtn">شراء</button>
  </div>
</div>

<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===================== Config (do not change rates) ===================== */
const DURATION_DAYS = 30;
const PACKAGES = [];

/* ===================== State ===================== */
const state = { balance:0, selected:1, owned:0, expiresAt:'' };
const fmt = n => n.toLocaleString('en-US');
const $ = id => document.getElementById(id);
const calc = price => ({fee:price, back:0});
const pkg = () => PACKAGES.find(p => p.level===state.selected);

/* ===================== Icons ===================== */
const DIA = '<svg viewBox="0 0 24 24"><path d="M6 4h12l4 6-10 11L2 10z"/><path d="M2 10h20M9 4l-2 6 5 11 5-11-2-6"/></svg>';
const IC = {
  entry:'<svg viewBox="0 0 24 24"><path d="M13 3L5 13h6l-1 8 8-11h-6z"/></svg>',
  frame:'<svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="6.5"/><circle cx="12" cy="13.5" r="2.8"/><path d="M8 4.5l2 2h4l2-2"/></svg>',
  vip:'<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="6"/><text x="12" y="14.6" text-anchor="middle" font-size="6.6" font-weight="700" font-style="italic" fill="currentColor" stroke="none" style="fill:#f1ecdd;font-family:Arial">VIP</text></svg>',
  follow:'<svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.6"/><path d="M3.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 11.5l2 2 3.5-4"/></svg>',
  friends:'<svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.6"/><path d="M3.5 20c0-3.6 2.9-6 6.5-6 1.4 0 2.6.3 3.6.8"/><path d="M18 20l-3-2.8c-1.3-1.5.6-3.4 2-2 .5.4.8.7 1 1 .2-.3.5-.6 1-1 1.4-1.4 3.300.5 2 2z"/></svg>',
  car:'<svg viewBox="0 0 24 24"><path d="M3.5 16.5v-4L6 8h12l2.5 4.5v4z"/><circle cx="7.5" cy="16.8" r="1.9" style="fill:#262c3b"/><circle cx="16.5" cy="16.8" r="1.9" style="fill:#262c3b"/></svg>',
  shield:'<svg viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.4-3 7.800-7 9.500-4-1.700-7-5.100-7-9.500V6z"/><rect x="9" y="11" width="6" height="5" rx="1"/><path d="M10 11V9.600a2 2 0 014 0V11"/></svg>',
  bubble:'<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="6"/><path d="M10.200 10.200h3.600M12 10.200V14"/><path d="M17 10h1.500M17 13.500h1.500"/></svg>',
  card:'<svg viewBox="0 0 24 24"><rect x="3" y="7.500" width="18" height="12.500" rx="3"/><path d="M7 12.500h6M7 16.200h4"/><path d="M15 6l1.200-2.200L17.500 6l1.300-2.200L19.500 7"/></svg>',
  star:'<svg viewBox="0 0 24 24"><path d="M12 3l2.600 5.500 6 .8-4.400 4.200 1.100 6-5.300-2.900L6.700 19.500l1.100-6L3.400 9.300l6-.8z"/></svg>',
  seat:'<svg viewBox="0 0 24 24"><path d="M5.500 11V8a3 3 0 013-3h7a3 3 0 013 3v3"/><rect x="3" y="11" width="18" height="6" rx="2.500"/><path d="M6.500 17v3M17.500 17v3"/></svg>',
  support:'<svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0116 0v2"/><rect x="3" y="13" width="4" height="6" rx="1.500"/><rect x="17" y="13" width="4" height="6" rx="1.500"/><path d="M19 19c0 1.500-2 2-5 2"/></svg>',
  mask:'<svg viewBox="0 0 24 24"><path d="M3 8.500c3-2 6-2 9 0 3-2 6-2 9 0 0 5.500-2.500 8.500-5.500 8.500-1.700 0-2.500-1.200-3.500-1.200S10.200 17 8.500 17C5.500 17 3 14 3 8.500z"/><path d="M6.500 11.500c1-.8 2.300-.8 3.200 0M14.300 11.500c.9-.8 2.200-.8 3.200 0"/></svg>',
  mute:'<svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="12" rx="5"/><path d="M8.5 17.5L7 21l4.500-3.500"/><path d="M4 3.500l16 17"/></svg>',
  gift:'<svg viewBox="0 0 24 24"><rect x="3.500" y="9" width="17" height="4" rx="1"/><path d="M5 13v7h14v-7M12 9v11"/><path d="M12 9C9 9 7.500 7.800 7.500 6.500S9 4.500 10 5c1 .5 2 2 2 4zM12 9c3 0 4.500-1.200 4.500-2.500S15 4.500 14 5c-1 .5-2 2-2 4z"/></svg>',
  palette:'<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18c1.400 0 2-1 1.500-2.200-.5-1.200.3-2.300 1.600-2.300H17a4 4 0 004-4c0-5-4-9.500-9-9.500z"/><circle cx="7.500" cy="11" r="1"/><circle cx="10" cy="7.500" r="1"/><circle cx="14.500" cy="7.500" r="1"/></svg>',
  highlight:'<svg viewBox="0 0 24 24"><rect x="3" y="5.500" width="18" height="11.500" rx="4"/><path d="M8 17l-1 3.500 4.500-3.500"/><path d="M12 8.300l1 2 2.200.3-1.600 1.500.4 2.200-2-1.100-2 1.100.4-2.200-1.600-1.500 2.200-.3z"/></svg>',
  door:'<svg viewBox="0 0 24 24"><rect x="5.500" y="3" width="11" height="18" rx="1.500"/><circle cx="13" cy="12" r=".9"/><path d="M16.500 8H20M16.500 16H20M3 21h18"/></svg>',
  eyeoff:'<svg viewBox="0 0 24 24"><path d="M2.500 12S6 5.500 12 5.500 21.500 12 21.500 12 18 18.500 12 18.500 2.500 12 2.500 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>',
  boost:'<svg viewBox="0 0 24 24"><path d="M12 19V6M6.500 11.500L12 6l5.500 5.500"/><path d="M6.500 20.500h11"/></svg>',
  spark:'<svg viewBox="0 0 24 24"><path d="M10 4l1.800 4.700 4.700 1.800-4.700 1.800L10 17l-1.800-4.700L3.500 10.500l4.700-1.800z"/><path d="M18 3v4M16 5h4M18 15v4M16 17h4"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>'
};

const PRIVS = [
  {ic:'entry',  min:1, label:n=>'مؤثرات الدخول'},
  {ic:'frame',  min:2, label:n=>'براويز مميزة'},
  {ic:'vip',    min:1, label:n=>'شارة SVIP'+n},
  {ic:'follow', min:1, label:n=>'المتابعة *'+(n*100)+'%'},
  {ic:'friends',min:2, label:n=>'مزيد من الاصدقاء'},
  {ic:'car',    min:3, label:n=>'احصل/ي على هذه السيارة'},
  {ic:'support',min:2, label:n=>'دعم متخصص'},
  {ic:'bubble', min:3, label:n=>'فقاعات دردشة'},
  {ic:'card',   min:3, label:n=>'بطاقة تعريف مميزة'},
  {ic:'palette',min:2, label:n=>'ألوان دردشة مميزة'},
  {ic:'highlight',min:4,label:n=>'رسائل بارزة في الدردشة'},
  {ic:'shield', min:3, label:n=>'منع الطرد'},
  {ic:'mute',   min:3, label:n=>'منع الكتم من التعليقات'},
  {ic:'star',   min:6, label:n=>'أولوية الظهور'},
  {ic:'door',   min:6, label:n=>'غرف SVIP حصرية'},
  {ic:'seat',   min:8, label:n=>'مقعد VIP في الغرفة'},
  {ic:'eyeoff', min:8, label:n=>'زيارة خفية'},
  {ic:'gift',   min:10,label:n=>'هدية حصرية'},
  {ic:'boost',  min:10,label:n=>'تسريع رفع المستوى'},
  {ic:'spark',  min:11,label:n=>'وصول مبكر للمزايا الجديدة'},
  {ic:'frame',  min:12,label:n=>'إطار ملكي متحرك'}
].filter(v=>v.min<=7);
const ELITE_MIN = 4;

/* ===================== Badge generator (one hue per tier) ===================== */
const TIERS = [
  ['#c98a54','#ff9a4a','#7a3b1a'],
  ['#c3ccd8','#5ec8ff','#2c4a6b'],
  ['#e9b94a','#3ddc97','#1f6b4a'],
  ['#efc15a','#4aa3ff','#24407a'],
  ['#f2c660','#b36bff','#5a2a8a'],
  ['#f4cb68','#ff5fa8','#8a1f55'],
  ['#f6d070','#ff3b4a','#9c1424'],
  ['#f4d27a','#a855ff','#4b1a8a'],
  ['#f8d67c','#19d3da','#0b5f6b'],
  ['#fadb84','#2ee59d','#0f6b4a'],
  ['#fcdf8c','#ff8a1f','#a33c06'],
  ['#ffe9ad','#7ee0ff','#6a0f2a']
];
function hexToRgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function rgbToHex(a){return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function shade(hex,t){const c=hexToRgb(hex),to=t>0?255:0,k=Math.abs(t);return rgbToHex(c.map(v=>v+(to-v)*k))}

function buildBadgeSVG(n){
  const [metal,gem,rib]=TIERS[n-1];
  const hi=shade(metal,.62),lo=shade(metal,-.4),dk=shade(metal,-.68);
  const gHi=shade(gem,.6),gLo=shade(gem,-.5);
  const rHi=shade(rib,.35),rLo=shade(rib,-.45);
  const red=n>=7, wings=1+Math.floor((n-1)/3);
  const f1=red?shade(gem,-.8):'#232c40', f2=red?shade(gem,-.93):'#0e131f';

  let rays='';
  if(n>=4){const c=6+n;for(let k=0;k<c;k++)rays+=`<polygon points="120,30 126,138 114,138" transform="rotate(${(360/c*k).toFixed(1)} 120 138)"/>`}

  let w='';
  for(let i=wings-1;i>=0;i--){
    const tx=182+i*10,ty=84-i*15,by=172-i*9;
    w+=`<path d="M128 ${by} C${tx+18} ${by-4} ${tx+16} ${ty+54} ${tx} ${ty} C${tx-14} ${ty+30} 150 ${by-60} 128 ${by-54} Z" fill="url(#mg)" stroke="${dk}" stroke-width="1.3" stroke-linejoin="round" opacity="${1-i*.06}"/>`
      +`<path d="M132 ${by-8} C${tx+4} ${by-16} ${tx} ${ty+56} ${tx-2} ${ty+14}" fill="none" stroke="${hi}" stroke-width="1" opacity=".7"/>`;
  }

  let laurel='';
  if(n>=8){
    for(const side of [1,-1]){
      for(let k=0;k<7;k++){
        const a=(100+k*11)*Math.PI/180;
        const px=120+72*Math.cos(a), py=146+72*Math.sin(a);
        const ang=(100+k*11)+90;
        const X=side===1?px:240-px;
        const R=side===1?ang:-ang;
        laurel+=`<ellipse cx="${X.toFixed(1)}" cy="${py.toFixed(1)}" rx="4.2" ry="10" transform="rotate(${R.toFixed(1)} ${X.toFixed(1)} ${py.toFixed(1)})" fill="url(#mg)" stroke="${dk}" stroke-width=".8"/>`;
      }
    }
  }

  const ruby=`url(#gg)`;
  let crown;
  if(n>=7) crown=`<path d="M90 54 L88 26 L102 41 L110 20 L120 37 L130 20 L138 41 L152 26 L150 54 Z" fill="url(#mg)" stroke="${dk}" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M92 54 H148" stroke="${hi}" stroke-width="2"/>
    <circle cx="88" cy="26" r="3.4" fill="${ruby}" stroke="${dk}" stroke-width=".8"/><circle cx="152" cy="26" r="3.4" fill="${ruby}" stroke="${dk}" stroke-width=".8"/>
    <circle cx="110" cy="20" r="3.4" fill="${ruby}" stroke="${dk}" stroke-width=".8"/><circle cx="130" cy="20" r="3.4" fill="${ruby}" stroke="${dk}" stroke-width=".8"/>
    <circle cx="120" cy="37" r="4" fill="${ruby}" stroke="${dk}" stroke-width=".8"/>`;
  else if(n>=4) crown=`<path d="M98 54 L96 32 L108 44 L120 26 L132 44 L144 32 L142 54 Z" fill="url(#mg)" stroke="${dk}" stroke-width="1.3" stroke-linejoin="round"/>
    <circle cx="120" cy="30" r="3.4" fill="${ruby}" stroke="${dk}" stroke-width=".8"/>`;
  else crown=`<path d="M104 54 L120 28 L136 54 Z" fill="url(#mg)" stroke="${dk}" stroke-width="1.3" stroke-linejoin="round"/>`;

  const rivets=[[72,84],[168,84],[120,60],[66,118],[174,118]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.4" fill="${hi}" stroke="${dk}" stroke-width=".6"/>`).join('');

  const spPos=[[44,70],[198,62],[36,170],[206,170],[62,36],[180,36],[28,120],[212,118],[120,12]];
  const sp=spPos.slice(0,3+Math.floor(n/2)).map((p,i)=>
    `<path class="sp" style="animation-delay:${(i*.45).toFixed(2)}s" d="M${p[0]} ${p[1]-5}l1.4 3.6 3.600 1.400-3.600 1.400-1.400 3.600-1.400-3.600-3.600-1.400 3.600-1.400z" fill="${i%2?gHi:hi}"/>`).join('');

  const SH='M120 46 L178 70 L178 144 C178 182 150 208 120 234 C90 208 62 182 62 144 L62 70 Z';
  return `<svg viewBox="0 0 240 272" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="شارة SVIP ${n}">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${hi}"/><stop offset=".35" stop-color="${metal}"/><stop offset=".7" stop-color="${lo}"/><stop offset="1" stop-color="${dk}"/></linearGradient>
    <linearGradient id="ms" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${lo}"/><stop offset=".25" stop-color="${hi}"/><stop offset=".5" stop-color="${metal}"/><stop offset=".75" stop-color="${hi}"/><stop offset="1" stop-color="${lo}"/></linearGradient>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">${n===12?'<stop offset="0" stop-color="#ff6ad5"/><stop offset=".35" stop-color="#7ee0ff"/><stop offset=".7" stop-color="#8dff9e"/><stop offset="1" stop-color="#ffd36a"/>':`<stop offset="0" stop-color="${gHi}"/><stop offset=".5" stop-color="${gem}"/><stop offset="1" stop-color="${gLo}"/>`}</linearGradient>
    <linearGradient id="fd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${f1}"/><stop offset="1" stop-color="${f2}"/></linearGradient>
    <linearGradient id="rb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${rHi}"/><stop offset=".5" stop-color="${rib}"/><stop offset="1" stop-color="${rLo}"/></linearGradient>
    <linearGradient id="tx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe6"/><stop offset="1" stop-color="${shade(metal,.2)}"/></linearGradient>
    <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${gem}" stop-opacity=".8"/><stop offset="1" stop-color="${gem}" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg" gradientUnits="userSpaceOnUse" cx="120" cy="138" r="108"><stop offset="0" stop-color="${hi}" stop-opacity=".9"/><stop offset="1" stop-color="${hi}" stop-opacity="0"/></radialGradient>
  </defs>
  <g fill="url(#rg)">${rays}</g>
  <g>${w}</g><g transform="translate(240 0) scale(-1 1)">${w}</g>
  ${laurel}
  ${crown}
  <path d="${SH}" fill="url(#ms)" stroke="${dk}" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="${SH}" transform="translate(120 140) scale(.9) translate(-120 -140)" fill="url(#mg)" stroke="${dk}" stroke-width="1" stroke-linejoin="round"/>
  <path d="${SH}" transform="translate(120 140) scale(.8) translate(-120 -140)" fill="url(#fd)" stroke="${hi}" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M120 70 C146 70 160 84 160 106" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="3" stroke-linecap="round"/>
  ${rivets}
  <circle cx="120" cy="130" r="48" fill="url(#gl)"/>
  <path d="M120 88 L152 130 L120 172 L88 130 Z" fill="url(#gg)" stroke="${hi}" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M120 88 L136 130 L120 172 Z" fill="#000" opacity=".16"/>
  <path d="M88 130 H152 M120 88 L104 130 L120 172 L136 130 Z" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="1" stroke-linejoin="round"/>
  <path d="M104 110 L116 98 L112 120 Z" fill="#fff" opacity=".7"/>
  <path d="M120 232 L130 243 L120 262 L110 243 Z" fill="url(#gg)" stroke="${dk}" stroke-width="1.2"/>
  <path d="M54 190 L70 182 L70 212 L54 212 L63 201 Z" fill="${rLo}" stroke="${hi}" stroke-width="1" stroke-linejoin="round"/>
  <path d="M186 190 L170 182 L170 212 L186 212 L177 201 Z" fill="${rLo}" stroke="${hi}" stroke-width="1" stroke-linejoin="round"/>
  <path d="M66 178 L174 178 L174 208 L66 208 Z" fill="url(#rb)" stroke="url(#ms)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M71 183 H169 M71 203 H169" stroke="${hi}" stroke-opacity=".55" stroke-width=".8"/>
  <text x="120" y="199.500" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="20" font-weight="700" letter-spacing="1.500" fill="url(#tx)" stroke="${rLo}" stroke-width=".6" paint-order="stroke">SVIP ${n}</text>
  ${sp}
</svg>`;
}
const BADGE_CACHE=new Array(13);
function badgeSVG(n){return BADGE_CACHE[n]||(BADGE_CACHE[n]=buildBadgeSVG(n));}

/* ===================== Render ===================== */
function renderTabs(){
  const box=$('tabs');
  if(!box.dataset.ready){
    const frag=document.createDocumentFragment();
    PACKAGES.forEach(p=>{
      const b=document.createElement('button');b.className='tab';b.id='tab'+p.level;
      b.setAttribute('role','tab');b.textContent='SVIP '+p.level;b.onclick=()=>select(p.level);
      frag.appendChild(b);
    });
    box.appendChild(frag);box.dataset.ready='1';
  }
  PACKAGES.forEach(p=>{
    const b=$('tab'+p.level);b.setAttribute('aria-selected',String(p.level===state.selected));
    b.classList.toggle('owned',state.owned===p.level);
  });
}
function select(n,scroll=true){
  const next=Math.max(1,Math.min(7,n));
  if(next===state.selected){if(scroll){const same=$('tab'+next);same&&same.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}return;}
  state.selected=next;
  renderTabs();
  render(true);
  if(scroll){const t=$('tab'+state.selected);t&&t.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}
}
function render(animate=false){
  const n=state.selected,p=pkg(); if(!p){$('buyBtn').disabled=true;return;} const {fee,back}=calc(p.price);
  $('app').style.setProperty('--tier',TIERS[n-1][1]);

  const bd=$('badge');
  const nextBadge=badgeSVG(n);
  if(bd.dataset.level!==String(n)){
    bd.innerHTML=nextBadge;
    bd.dataset.level=String(n);
    if(animate && !matchMedia('(prefers-reduced-motion: reduce)').matches){
      bd.animate([{opacity:.72,transform:'translateY(5px) scale(.97)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:190,easing:'cubic-bezier(.2,.75,.25,1)'});
    }
  }

  const on=n>=ELITE_MIN;
  $('elite').className='elite'+(on?' on':'');
  $('eliteIcon').innerHTML=IC.mask+(on?'':'<span class="lk" style="position:absolute;bottom:-2px;left:-2px;width:22px;height:22px;border-radius:50%;background:#212736;border:1px solid #565e72;display:grid;place-items:center"><span style="width:12px;height:12px;display:block">'+IC.lock.replace('<svg','<svg style="width:12px;height:12px;stroke:#7a8296;stroke-width:2"')+'</span></span>');

  const grid=$('grid');
  if(!grid.dataset.ready){
    grid.innerHTML=PRIVS.map(v=>`<div class="pv"><div class="circ">${IC[v.ic]}<span class="lk">${IC.lock}</span></div><span></span><small></small></div>`).join('');
    grid.dataset.ready='1';
  }
  PRIVS.forEach((v,i)=>{
    const card=grid.children[i],ok=n>=v.min;
    card.classList.toggle('on',ok);
    card.querySelector('.circ > .lk').hidden=ok;
    card.querySelector('.circ + span').textContent=v.label(n);
    card.querySelector('small').textContent=ok?'':'من SVIP'+v.min;
  });

  const dia=DIA;
  $('sPrice').innerHTML=fmt(p.price)+' '+dia;
  $('bPrice').textContent=fmt(p.price); $('bUsd').textContent='';
  const st=$('bState');
  if(state.owned===n){
    const expiry=state.expiresAt?new Date(state.expiresAt):null;
    const dateText=expiry&&!Number.isNaN(expiry.getTime())?' · تنتهي '+expiry.toLocaleDateString('ar-IQ'):'';
    st.textContent='عضويتك فعّالة'+dateText;st.className='l2 ok'
  }
  else{st.textContent='أنت لست SVIP'+n;st.className='l2'}
  $('buyBtn').textContent=state.owned===n?'تجديد':'شراء';
  $('buyBtn').disabled=!p.active || p.price<=0;
  $('balance').textContent=fmt(state.balance);
}

/* ===================== Sheets ===================== */
function openSheet(html){$('sheet').innerHTML='<div class="grab"></div>'+html;$('veil').classList.add('open')}
function closeSheet(){$('veil').classList.remove('open')}
$('veil').addEventListener('click',e=>{if(e.target.id==='veil')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}

function breakdownHTML(p,fee,back,afterBal){
  return `<div class="split">
    <div class="row"><span>سعر الباقة</span><b>${fmt(p.price)} ${DIA}</b></div>
    
    <div class="row"><span>مدة العضوية</span><b>${DURATION_DAYS} يوماً</b></div>
    
  </div>`;
}

function openBuy(){
  const p=pkg(); if(!p){toast('لم يتم تحميل باقات SVIP بعد');return;} const {fee,back}=calc(p.price),enough=state.balance>=p.price && p.active!==false;
  const renew=state.owned===p.level;
  openSheet(`<h2>${renew?'تجديد':'شراء'} SVIP ${p.level}</h2>
    <p class="sub">رصيدك الحالي ${fmt(state.balance)} ماسة. كل ترقية تُحاسب بالسعر الكامل للمستوى الجديد وتبدأ مدة 30 يوماً جديدة.</p>
    ${breakdownHTML(p,fee,back,state.balance>=p.price?state.balance-fee:null)}
    ${enough?'':`<p class="err">رصيدك لا يكفي. تحتاج إلى ${fmt(p.price-state.balance)} ماسة إضافية.</p>`}
    <div class="acts"><button class="btn ghost" onclick="closeSheet()">إلغاء</button>
    <button class="btn main" id="okBuy" ${enough?'':'disabled'}>تأكيد الشراء</button></div>`);
  $('okBuy').onclick=()=>{
    $('okBuy').disabled=true;
    if(window.AndroidVip){window.AndroidVip.purchase(p.level);}
    else{ $('okBuy').disabled=false; toast('تعذر الاتصال بالتطبيق'); }
  };
}

function openInfo(){
  openSheet(`<h2>امتيازات النخبة</h2>
    <p class="sub">تبدأ من VIP${ELITE_MIN}. عند دخولك الغرفة يظهر اسمك كرجل غامض بدل ظهور الإشعار المعتاد، فتدخل دون لفت الانتباه.</p>
    <div class="acts"><button class="btn main" onclick="closeSheet()">حسناً</button></div>`);
}

/* Purchases are executed by the authenticated Android app and backend. */
function onNativePurchaseResult(ok,message){
  if(ok){
    closeSheet();
    toast(message || 'تم تنفيذ العملية بنجاح');
  }else{
    const b=$('okBuy'); if(b) b.disabled=false;
    toast(message || 'تعذر إتمام الشراء');
  }
}
window.applyNativeData=function(data){
  try{
    const d=typeof data==='string'?JSON.parse(data):data;
    if(Array.isArray(d.packages)){
      PACKAGES.splice(0,PACKAGES.length,...d.packages.map(p=>({
        level:Number(p.vip_level ?? p.level),
        price:Number(p.price_diamonds ?? p.price),
        active:p.active!==false
      })).filter(p=>p.level>0 && p.price>0));
    }
    state.balance=Number(d.balance||0);
    const m=d.membership||{};
    state.owned=Number(m.vip_level||m.level||0);
    state.expiresAt=String(m.expires_at||'');
    if(PACKAGES.length===0){toast('لا توجد مستويات SVIP متاحة حالياً');$('buyBtn').disabled=true;return;}
    $('buyBtn').disabled=false;
    if(!PACKAGES.some(p=>p.level===state.selected)) state.selected=PACKAGES[0]?.level||1;
    renderTabs(); render();
  }catch(e){toast('تعذر قراءة بيانات SVIP');}
};
window.onNativeLoadError=function(message){toast(message||'تعذر تحميل بيانات SVIP');};
window.addEventListener('load',()=>{
  if(window.AndroidVip) window.AndroidVip.onPageReady();
});

/* ===================== Events ===================== */
$('buyBtn').onclick=openBuy;
$('infoBtn').onclick=openInfo;
$('backBtn').onclick=()=>{ if(window.AndroidVip) AndroidVip.close(); else if(history.length>1) history.back(); };

// swipe on the badge to move between levels (RTL: swipe right = next level)
(function(){
  let x0=null;const h=$('hero');
  h.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  h.addEventListener('touchend',e=>{
    if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;
    if(Math.abs(dx)>50) select(state.selected+(dx>0?1:-1));
  });
})();

/* Initial content is rendered only after authenticated data arrives from Android. */
</script>
