name: Inspect Mariam Live backend (read only)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mariam-live-development

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mariam-live-development
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MARIAM_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 185.174.252.118 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Patch backend voice room closure
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15 mariam-admin@185.174.252.118 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/mariam-live/backend
          FILE=src/routes/voice-rooms.js
          test -f "$FILE"
          cp -a "$FILE" "$FILE.backup-close-room-$(date +%Y%m%d%H%M%S)"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/routes/voice-rooms.js")
          s=p.read_text()
          start=s.index('  // Close room (owner only)')
          end=s.index('\n  });', start)+len('\n  });')
          replacement = r'''  // Close room (owner only): close it in the database and remove every member.
  // Deleting the LiveKit room disconnects all participants immediately.
  app.delete("/api/voice-rooms/:roomId", authenticateToken, async (req, res) => {
    const roomId = req.params.roomId;
    const client = await db.connect();
    try {
      await client.query("BEGIN");
      await client.query("SELECT pg_advisory_xact_lock(hashtext($1))", [roomId]);
      const roomResult = await client.query(
        "SELECT id, owner_id, status FROM voice_rooms WHERE id=$1 FOR UPDATE",
        [roomId]
      );
      if (!roomResult.rows.length) {
        await client.query("ROLLBACK");
        return res.status(404).json({ error: "Room not found" });
      }
      const room = roomResult.rows[0];
      if (String(room.owner_id) !== String(req.userId)) {
        await client.query("ROLLBACK");
        return res.status(403).json({ error: "Only the room owner can close this room" });
      }
      if (room.status !== "closed") {
        await client.query("UPDATE voice_rooms SET status='closed' WHERE id=$1", [roomId]);
        await client.query("DELETE FROM room_members WHERE room_id=$1", [roomId]);
        await client.query(
          "UPDATE voice_room_seats SET user_id=NULL,is_muted=FALSE,assigned_at=NULL WHERE room_id=$1",
          [roomId]
        );
        await client.query("DELETE FROM voice_room_hand_raises WHERE room_id=$1", [roomId]);
      }
      await client.query("COMMIT");

      let livekitClosed = false;
      try {
        const { RoomServiceClient } = require("livekit-server-sdk");
        const apiKey = process.env.LIVEKIT_API_KEY;
        const apiSecret = process.env.LIVEKIT_API_SECRET;
        if (apiKey && apiSecret) {
          const host = (process.env.LIVEKIT_URL || "wss://voicenokiraq.duckdns.org")
            .replace(/^wss:/, "https:").replace(/^ws:/, "http:");
          const service = new RoomServiceClient(host, apiKey, apiSecret);
          await service.deleteRoom(roomId);
          livekitClosed = true;
        } else {
          console.error("LiveKit deletion skipped: API credentials are missing");
        }
      } catch (livekitError) {
        console.error("LiveKit room deletion failed:", livekitError.message);
      }
      return res.json({
        message: "Room closed successfully",
        roomId,
        livekitClosed,
        notice: "تم إغلاق البث بواسطة صاحب الغرفة"
      });
    } catch (error) {
      try { await client.query("ROLLBACK"); } catch (_) {}
      console.error("Close room:", error.message);
      return res.status(500).json({ error: "Could not close room" });
    } finally {
      client.release();
    }
  });'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY
          node --check "$FILE"
          echo "Backend route syntax check passed."
          echo "===== RESTART TARGET DISCOVERY ====="
          pid=$(ss -ltnpH 'sport = :3000' 2>/dev/null | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -1 || true)
          if [ -n "$pid" ]; then
            echo "API_PID=$pid"
            cat "/proc/$pid/cgroup" || true
            unit=$(sed -n 's#.*\(/[^/]*\.service\).*#\1#p' "/proc/$pid/cgroup" | head -1 | sed 's#^.*/##')
            if [ -n "$unit" ] && systemctl list-unit-files "$unit" --no-legend 2>/dev/null | grep -q "$unit"; then
              systemctl restart "$unit"
              echo "RESTARTED_SYSTEMD_UNIT=$unit"
            elif command -v pm2 >/dev/null 2>&1 && pm2 jlist 2>/dev/null | grep -q '"name"'; then
              pm2 restart all
              echo "RESTARTED_PM2=all"
            else
              echo "RESTART_REQUIRED=manual; no known service manager matched API PID"
            fi
          else
            echo "API_PID_NOT_FOUND_ON_3000; restart not attempted"
          fi
          REMOTE
      - name: Run read-only API and database smoke tests
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15 mariam-admin@185.174.252.118 'bash -s' <<'REMOTE'
          set +e
          echo "===== API ROOT ====="
          curl -sS --max-time 8 -i http://127.0.0.1:3000/
          echo
          echo "===== API HEALTH AND DATABASE ====="
          curl -sS --max-time 8 -i http://127.0.0.1:3000/api/health
          echo
          echo "===== AUTH LOGIN ROUTE (READ ONLY, EXPECT 401) ====="
          curl -sS --max-time 8 -w "\\nHTTP_STATUS:%{http_code}\\n" -H "Content-Type: application/json" -d '{"identifier":"mariam-live-smoke-test-invalid","password":"not-a-real-password"}' http://127.0.0.1:3000/api/auth/login
          echo "===== AUTH ME WITHOUT TOKEN (EXPECT 401) ====="
          curl -sS --max-time 8 -w "\\nHTTP_STATUS:%{http_code}\\n" http://127.0.0.1:3000/api/auth/me
          echo "===== NODE PROCESS (ALL USERS) ====="
          ps -eo user,pid,ppid,args | grep -E '[n]ode|[p]m2'
          echo "===== PROCESS ON PORT 3000 ====="
          fuser -v 3000/tcp 2>&1 || true
          echo "===== PM2 FOR mariam-admin ====="
          pm2 list
          echo "===== ALL SYSTEMD SERVICES MATCHING APP ====="
          systemctl list-units --all --type=service --no-pager | grep -Ei 'mariam|node|pm2|postgres' || true
          echo "===== SERVICE FILES MATCHING APP ====="
          systemctl list-unit-files --type=service --no-pager | grep -Ei 'mariam|node|pm2' || true
          REMOTE
      - name: Read backend source without secrets
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15 mariam-admin@185.174.252.118 'bash -s' > backend-inspection.txt <<'REMOTE'
          set -eu
          cd /opt/mariam-live/backend
          echo "===== PACKAGE.JSON ====="
          cat package.json
          echo "===== SOURCE FILES ====="
          find src -maxdepth 5 -type f -not -path "*/node_modules/*" -printf "%p (%s bytes)\n" | sort
          echo "===== SOURCE CONTENTS ====="
          find src -maxdepth 5 -type f \( -name '*.js' -o -name '*.ts' -o -name '*.json' \) -not -path "*/node_modules/*" -print0 | while IFS= read -r -d '' f; do
            echo "--- FILE: $f"
            sed -n '1,280p' "$f"
          done
          echo "===== MIGRATIONS ====="
          for f in /opt/mariam-live/database/*.sql; do
            [ -f "$f" ] || continue
            echo "--- FILE: $f"
            sed -n '1,280p' "$f"
          done
          echo "===== SERVICE STATUS ====="
          pm2 list
          REMOTE
      - name: Publish inspection report to development branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-inspection.txt
          git commit -m "Add read-only backend inspection report" || exit 0
          git push origin HEAD:feature/mariam-live-development
