name: Inspect Mariam Live backend (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MARIAM_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 185.174.252.118 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Read backend structure and API routes
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15 mariam-admin@185.174.252.118 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/mariam-live/backend
          echo "===== PACKAGE.JSON ====="
          cat package.json
          echo "===== SOURCE FILES ====="
          find src -maxdepth 4 -type f -not -path "*/node_modules/*" -printf "%p (%s bytes)\n" | sort
          echo "===== ROUTES AND SOCKETS ====="
          grep -RInE "router\.(get|post|put|patch|delete)|app\.(get|post|put|patch|delete)|io\.on|socket\.on|createServer|listen\(" src --include='*.js' --include='*.ts' || true
          echo "===== DATABASE MIGRATIONS ====="
          find /opt/mariam-live/database -maxdepth 2 -type f -name '*.sql' -print
          for f in /opt/mariam-live/database/*.sql; do
            [ -f "$f" ] || continue
            echo "--- $f"
            sed -n '1,240p' "$f"
          done
          echo "===== PM2 STATUS ====="
          pm2 list
          REMOTE
