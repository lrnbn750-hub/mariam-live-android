name: Mariam Live Android CI

on:
  push:
    branches:
      - main
      - feature/mariam-live-development
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Download full-resolution Malak welcome image
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl -k -fL --retry 3 --retry-delay 2 "https://i.top4top.io/p_3966x4g0b0.png" -o app/src/main/res/drawable-nodpi/malak_splash.png
          file app/src/main/res/drawable-nodpi/malak_splash.png
          test -s app/src/main/res/drawable-nodpi/malak_splash.png

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Mariam-Live-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
