name: Repair Mariam Live room image backend
on:
  push:
    branches:
      - feature/mariam-live-development
    paths:
      - .github/workflows/repair-room-images.yml
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mariam-live-development
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MARIAM_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 185.174.252.118 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy room API and apply compatible migration
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes backend/voice-rooms.js mariam-admin@185.174.252.118:/tmp/mariam-voice-rooms.js
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes backend/profile-id-migration.sql mariam-admin@185.174.252.118:/tmp/mariam-profile-id.sql
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes mariam-admin@185.174.252.118 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/mariam-live/backend
          cp -a src/server.js "src/server.js.backup-room-images-$(date +%Y%m%d%H%M%S)"
          cp -a src/routes/voice-rooms.js "src/routes/voice-rooms.js.backup-room-images-$(date +%Y%m%d%H%M%S)"
          install -m 640 /tmp/mariam-voice-rooms.js src/routes/voice-rooms.js
          echo "ROOM_IMAGE_COLUMN_ALREADY_ADDED_MANUALLY"
          mkdir -p /opt/mariam-live/uploads/rooms
                    chmod 750 /opt/mariam-live/uploads /opt/mariam-live/uploads/rooms
          node <<'NODE'
          const fs = require("fs");
          const file = "src/server.js";
          let source = fs.readFileSync(file, "utf8");
          source = source.replace('express.json({ limit: "2mb" })', 'express.json({ limit: "8mb" })');
          const staticRoute = 'app.use("/uploads", express.static("/opt/mariam-live/uploads", { maxAge: "7d", immutable: true }));';
          if (!source.includes(staticRoute)) {
            const marker = "app.use(cors());";
            if (!source.includes(marker)) throw new Error("CORS middleware marker missing");
            source = source.replace(marker, marker + "\n" + staticRoute);
          }
          fs.writeFileSync(file, source);
          NODE
          rm -f /tmp/mariam-voice-rooms.js /tmp/mariam-profile-id.sql
          sudo -n /usr/local/sbin/restart-mariam-live
          echo "=== HEALTH ==="
          for attempt in $(seq 1 15); do
  if curl -fsS --max-time 8 https://nokiraq.duckdns.org/api/health; then
    echo
    break
  fi
  if [ "$attempt" -eq 15 ]; then
    echo "HEALTH_CHECK_FAILED_AFTER_RETRIES"
    exit 1
  fi
  echo "Health endpoint not ready yet (attempt $attempt/15); waiting 2 seconds..."
  sleep 2
done
          echo
          echo "=== STATIC ROUTE ==="
          grep -n 'app.use("/uploads"' src/server.js
          echo "=== JSON LIMIT ==="
          grep -n 'express.json' src/server.js
          echo "=== ROOM IMAGE DIAGNOSTICS ==="
          node <<'NODE'
          require("dotenv").config();
          const { Client } = require("pg");
          const fs = require("fs");
          const path = require("path");
          (async () => {
            const db = new Client({
              host: process.env.DB_HOST, port: Number(process.env.DB_PORT || 5432),
              database: process.env.DB_NAME, user: process.env.DB_USER,
              password: process.env.DB_PASSWORD
            });
            await db.connect();
            try {
              const q = await db.query("SELECT id, name, image_url FROM public.voice_rooms ORDER BY created_at DESC LIMIT 5");
              for (const r of q.rows) {
                const u = r.image_url || "";
                const filename = u.split("/").pop();
                const file = filename ? path.join("/opt/mariam-live/uploads/rooms", filename) : "";
                console.log(JSON.stringify({room_id:r.id, name:r.name, has_image_url:!!u, image_url:u || null, file_exists:!!file && fs.existsSync(file), file_size:!!file && fs.existsSync(file) ? fs.statSync(file).size : 0}));
                if (u) {
                  const { execFileSync } = require("child_process");
                  try { console.log("IMAGE_HTTP " + execFileSync("curl", ["-sS","-o","/dev/null","-w","%{http_code} %{content_type}","--max-time","8",u], {encoding:"utf8"})); }
                  catch(e) { console.log("IMAGE_HTTP_FAILED " + e.message); }
                }
              }
            } finally { await db.end(); }
          })().catch(e => { console.error("ROOM_DIAGNOSTIC_FAILED", e.message); process.exit(1); });
          NODE
          REMOTE
