name: Deploy BAK LIVE room session manager

on:
  workflow_dispatch:
  push:
    branches:
      - feature/bak-live-camera-modes-on-build465
    paths:
      - .github/workflows/deploy-livekit-backend.yml
      - backend/livekit-route.js
      - backend/voice-rooms.js
      - backend/room-presence-migration.sql

permissions:
  contents: read

jobs:
  deploy-room-session-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MARIAM_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 185.174.252.118 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload room session backend files
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes backend/livekit-route.js mariam-admin@185.174.252.118:/tmp/bak-live-livekit-route.js
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes backend/voice-rooms.js mariam-admin@185.174.252.118:/tmp/bak-live-voice-rooms.js
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes backend/room-presence-migration.sql mariam-admin@185.174.252.118:/tmp/bak-live-room-presence.sql

      - name: Install, migrate, validate and restart
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes mariam-admin@185.174.252.118 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/mariam-live/backend

          echo "Reading database configuration"
          DB_NAME="$(node -e 'require("dotenv").config({quiet:true}); process.stdout.write(process.env.DB_NAME || "")')"
          DB_USER="$(node -e 'require("dotenv").config({quiet:true}); process.stdout.write(process.env.DB_USER || "")')"
          test -n "$DB_NAME" || { echo "DB_NAME is missing in backend .env"; exit 21; }
          test -n "$DB_USER" || { echo "DB_USER is missing in backend .env"; exit 22; }

          echo "Applying room presence migration"
          sudo -n -u postgres psql -v ON_ERROR_STOP=1 -d "$DB_NAME" -v app_role="$DB_USER" -f /tmp/bak-live-room-presence.sql

          echo "Installing room routes"
          install -m 640 /tmp/bak-live-livekit-route.js src/routes/livekit.js
          install -m 640 /tmp/bak-live-voice-rooms.js src/routes/voice-rooms.js
          rm -f /tmp/bak-live-livekit-route.js /tmp/bak-live-voice-rooms.js /tmp/bak-live-room-presence.sql

          echo "Checking JavaScript syntax"
          node --check src/routes/livekit.js
          node --check src/routes/voice-rooms.js

          echo "Restarting BAK LIVE API"
          sudo -n /usr/local/sbin/restart-mariam-live
          echo "Checking API health"
          curl --retry 5 --retry-delay 2 --retry-connrefused -fsS https://nokiraq.duckdns.org/api/health
          echo
          echo "BAK LIVE room session manager deployed successfully"
          REMOTE
